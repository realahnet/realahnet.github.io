<style>
  .custom-spoiler {
    position: relative;
    background-color: rgba(128, 128, 128, 0.15);
    cursor: pointer;
    user-select: none;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px dashed rgba(128, 128, 128, 0.4);
    display: inline-block;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .custom-spoiler .spoiler-text {
    color: transparent;
    transition: color 0.25s ease;
  }
  .custom-spoiler .spoiler-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-style: italic;
    font-size: 0.85em;
    opacity: 0.6;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .custom-spoiler.revealed .spoiler-text {
    color: inherit;
  }
  .custom-spoiler.revealed .spoiler-hint {
    opacity: 0;
  }
  .custom-spoiler.revealed {
    border-color: transparent;
    background-color: rgba(128, 128, 128, 0.05);
  }
</style>

<span class="custom-spoiler" onclick="this.classList.toggle('revealed')"><span class="spoiler-text">{{ .Inner }}</span><span class="spoiler-hint">click me!</span></span>
